name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        container: node:24-trixie
        steps:
            - uses: actions/checkout@v4
            - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
            - run: npm ci --no-audit --no-fund
            - run: npm run check
